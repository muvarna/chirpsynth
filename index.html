<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChirpSynth: Bioacoustic Sampler</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.all.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }
        #root:empty::before {
            content: 'INITIALIZING BIOACOUSTIC ENGINE...';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.3em;
            color: #06b6d4;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        #error-display {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            z-index: 9999;
            display: none;
            border: 1px solid #ef4444;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <div id="error-display"></div>
    
    <script>
      const errDisp = document.getElementById('error-display');
      function showError(msg) {
        errDisp.style.display = 'block';
        errDisp.innerText = 'SYSTEM_ERROR: ' + msg;
      }
      window.onerror = (msg, url, line, col) => showError(`${msg}\nFile: ${url}\nLine: ${line}:${col}`);
      window.onunhandledrejection = (event) => showError(`Promise Rejection: ${event.reason}`);

      // Manual Bootstrapper: Fetches TSX, transforms it via Babel, and injects as a module.
      async function boot() {
        try {
          // Add cache-busting to ensure we always get the latest code
          const resp = await fetch('./index.tsx?v=' + Date.now());
          if (!resp.ok) throw new Error(`Failed to load index.tsx: ${resp.status}`);
          const tsxCode = await resp.text();
          
          const result = Babel.transform(tsxCode, {
            presets: ['react', ['typescript', { isTSX: true, allExtensions: true }]],
            filename: 'index.tsx',
            sourceMaps: 'inline'
          });

          const script = document.createElement('script');
          script.type = 'module';
          script.text = result.code;
          document.body.appendChild(script);
        } catch (e) {
          showError(e.message);
        }
      }

      // Start the application immediately. Service workers are disabled
      // as they frequently fail with origin mismatch in development sandboxes.
      boot();
    </script>
</body>
</html>
